[package]
name = "quotafern"
version = "0.1.0"
description = "A compact desktop popup for AI subscription quotas"
authors = ["Quotafern contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "quotafern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
