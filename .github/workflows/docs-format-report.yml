name: Docs format report (temporary, read-only)

on:
  push:
    branches:
      - docs/post-acc04-docs-cleanup

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Emit exact Oxfmt formatted patch as safe text
        shell: bash
        run: |
          bun run fmt
          python3 - <<'PY'
          import json
          import pathlib
          import time
          import subprocess
          names = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          print("OXFMT_FORMATTED_FILES_BEGIN", flush=True)
          for name in names:
              data = json.dumps(pathlib.Path(name).read_text(encoding="utf-8"), ensure_ascii=True)
              print("OXFMT_FILE_START:" + name, flush=True)
              for start in range(0, len(data), 3500):
                  print("OXFMT_CHUNK:" + data[start:start+3500], flush=True)
                  time.sleep(0.08)
              print("OXFMT_FILE_END", flush=True)
          print("OXFMT_FORMATTED_FILES_END", flush=True)
          PY
